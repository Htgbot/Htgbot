<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-label="Animated HARRY developer banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0823"/><stop offset="0.55" stop-color="#1b1042"/><stop offset="1" stop-color="#090b20"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop stop-color="#c4a1ff"/><stop offset="0.55" stop-color="#a855f7"/><stop offset="1" stop-color="#4de1d1"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9c73ff" stroke-opacity=".1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  <clipPath id="reveal"><rect x="0" y="0" width="0" height="100%"><animate attributeName="width" values="0;530;530" keyTimes="0;.48;1" dur="5.4s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1100" height="310" rx="24" fill="url(#bg)"/><rect width="1100" height="310" rx="24" fill="url(#grid)"/>
<circle cx="930" cy="65" r="105" fill="#6d28d9" opacity=".19" filter="url(#glow)"/><circle cx="230" cy="245" r="94" fill="#14b8a6" opacity=".10" filter="url(#glow)"/>
<g font-family="monospace" fill="#c5afff" font-size="18" opacity=".7"><text x="49" y="58">&lt;developer mode="creative" /&gt;</text><text x="850" y="260">{ build: 'different' }</text></g>
<g clip-path="url(#reveal)"><text x="50" y="186" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="116" letter-spacing="7" fill="url(#name)">HARRY</text></g>
<rect x="50" y="203" width="0" height="4" rx="2" fill="#38dccd"><animate attributeName="width" values="0;475;475" keyTimes="0;.48;1" dur="5.4s" repeatCount="indefinite"/></rect>
<text x="54" y="238" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">SOLO BUILDER  /  AI-POWERED MAKER  /  PROBLEM SOLVER</text>
<text x="54" y="276" fill="#b8b2d5" font-family="monospace" font-size="15">I turn ideas into working products — from Sri Lanka to the world.</text>
<g fill="none" stroke="#ab83fd" opacity=".8" stroke-width="2"><path d="M870 115l-18 18 18 18"/><path d="M919 115l18 18-18 18"/><path d="M907 107l-23 52"/></g>
<circle cx="1035" cy="40" r="5" fill="#5eead4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
</svg>
